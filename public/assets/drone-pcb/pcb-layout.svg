<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <rect width="800" height="600" fill="#1a1a2e"/>
  <rect x="200" y="100" width="400" height="400" rx="8" fill="#0d4a2e" stroke="#1a7a4a" stroke-width="2"/>
  <!-- Traces -->
  <line x1="250" y1="200" x2="550" y2="200" stroke="#b87333" stroke-width="1.5" opacity="0.6"/>
  <line x1="250" y1="250" x2="550" y2="250" stroke="#b87333" stroke-width="1.5" opacity="0.6"/>
  <line x1="250" y1="300" x2="550" y2="300" stroke="#b87333" stroke-width="1.5" opacity="0.6"/>
  <line x1="250" y1="350" x2="550" y2="350" stroke="#b87333" stroke-width="1.5" opacity="0.6"/>
  <line x1="300" y1="150" x2="300" y2="450" stroke="#b87333" stroke-width="1.5" opacity="0.6"/>
  <line x1="400" y1="150" x2="400" y2="450" stroke="#b87333" stroke-width="1.5" opacity="0.6"/>
  <line x1="500" y1="150" x2="500" y2="450" stroke="#b87333" stroke-width="1.5" opacity="0.6"/>
  <!-- STM32 chip -->
  <rect x="340" y="240" width="120" height="120" rx="4" fill="#1a1a1a" stroke="#444" stroke-width="1"/>
  <text x="400" y="290" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="10">STM32</text>
  <text x="400" y="305" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="10">F405RGT6</text>
  <!-- Components -->
  <rect x="250" y="160" width="30" height="15" rx="2" fill="#333" stroke="#555" stroke-width="0.5"/>
  <rect x="520" y="160" width="30" height="15" rx="2" fill="#333" stroke="#555" stroke-width="0.5"/>
  <rect x="250" y="420" width="30" height="15" rx="2" fill="#333" stroke="#555" stroke-width="0.5"/>
  <rect x="520" y="420" width="30" height="15" rx="2" fill="#333" stroke="#555" stroke-width="0.5"/>
  <!-- Capacitors -->
  <rect x="280" y="370" width="8" height="12" rx="1" fill="#c4a35a"/>
  <rect x="310" y="370" width="8" height="12" rx="1" fill="#c4a35a"/>
  <rect x="480" y="370" width="8" height="12" rx="1" fill="#c4a35a"/>
  <rect x="510" y="370" width="8" height="12" rx="1" fill="#c4a35a"/>
  <!-- Pads -->
  <circle cx="220" cy="120" r="6" fill="#c4a35a" opacity="0.8"/>
  <circle cx="220" cy="480" r="6" fill="#c4a35a" opacity="0.8"/>
  <circle cx="580" cy="120" r="6" fill="#c4a35a" opacity="0.8"/>
  <circle cx="580" cy="480" r="6" fill="#c4a35a" opacity="0.8"/>
  <!-- Label -->
  <text x="400" y="540" text-anchor="middle" fill="#4ade80" font-family="monospace" font-size="14" font-weight="bold">PCB LAYOUT — PLACEHOLDER</text>
  <text x="400" y="560" text-anchor="middle" fill="#666" font-family="monospace" font-size="11">Replace with actual KiCad export</text>
</svg>
