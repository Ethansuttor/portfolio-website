<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0f23;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#1a1a3e;stop-opacity:1"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <!-- 3D Board shape (perspective) -->
  <polygon points="200,180 600,150 620,420 180,450" fill="#0d4a2e" stroke="#1a7a4a" stroke-width="2"/>
  <!-- Board edge highlight -->
  <polygon points="180,450 620,420 620,430 180,460" fill="#0a3a22"/>
  <!-- Components on board -->
  <rect x="350" y="250" width="100" height="80" rx="3" fill="#1a1a1a" stroke="#444" stroke-width="1" transform="skewY(-1)"/>
  <text x="400" y="290" text-anchor="middle" fill="#888" font-family="monospace" font-size="10" transform="skewY(-1)">STM32</text>
  <!-- Small components -->
  <rect x="280" y="220" width="20" height="10" rx="1" fill="#333" transform="skewY(-1)"/>
  <rect x="280" y="240" width="20" height="10" rx="1" fill="#333" transform="skewY(-1)"/>
  <rect x="500" y="220" width="20" height="10" rx="1" fill="#333" transform="skewY(-1)"/>
  <rect x="500" y="250" width="20" height="10" rx="1" fill="#333" transform="skewY(-1)"/>
  <rect x="320" y="350" width="15" height="8" rx="1" fill="#c4a35a" transform="skewY(-1)"/>
  <rect x="350" y="350" width="15" height="8" rx="1" fill="#c4a35a" transform="skewY(-1)"/>
  <rect x="440" y="350" width="15" height="8" rx="1" fill="#c4a35a" transform="skewY(-1)"/>
  <rect x="470" y="350" width="15" height="8" rx="1" fill="#c4a35a" transform="skewY(-1)"/>
  <!-- Connector -->
  <rect x="230" y="300" width="30" height="60" rx="2" fill="#222" stroke="#555" stroke-width="1" transform="skewY(-1)"/>
  <!-- Label -->
  <text x="400" y="520" text-anchor="middle" fill="#4ade80" font-family="monospace" font-size="14" font-weight="bold">3D RENDER — PLACEHOLDER</text>
  <text x="400" y="545" text-anchor="middle" fill="#666" font-family="monospace" font-size="11">Replace with actual KiCad 3D viewer export</text>
</svg>
